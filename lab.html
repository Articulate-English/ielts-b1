<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tilted Tiles Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--purple:#8b5cf6;--purple-dim:rgba(139,92,246,.35);--cream:#f4f1ea;--dim:rgba(244,241,234,.55);--bg:#06060c;--panel:#0b0b16;--line:rgba(139,92,246,.22);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.55;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(8,8,16,.96);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:170px}
.brand b{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream)}
.brand span{font-size:11px;color:var(--dim);letter-spacing:.04em}
main{flex:1 1 auto;display:flex;min-height:0}
#sidePanel{flex:0 0 340px;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
#panelWrap{flex:1 1 auto;overflow-y:auto;padding:10px}
#previews{flex:1 1 auto;min-width:0;background:#000;position:relative;overflow:hidden}
.preview{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 40%,rgba(34,211,238,.18) 0%,transparent 60%),radial-gradient(ellipse 70% 50% at 80% 20%,rgba(251,191,36,.14) 0%,transparent 60%)}
.tt-wrap{position:absolute;inset:0;perspective:1600px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tt-plane{width:280%;height:260%;transform:rotateX(40deg) rotateY(16deg) rotateZ(-20deg) translateX(-40px);transform-origin:center;display:flex;gap:8px;justify-content:center}
.tt-col{display:flex;flex-direction:column;gap:8px;animation:tt-scroll 25s linear infinite}
.tt-col:nth-child(2){animation-direction:reverse}
.tt-tile{position:relative;width:220px;aspect-ratio:1;border-radius:12px;overflow:hidden;flex-shrink:0;transform:scale(1);transform-origin:center}
.tt-tile img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1)}
.tt-tile span{position:absolute;left:8px;bottom:8px;font-size:0.85rem;font-weight:600;padding:4px 10px;border-radius:8px;background:rgba(15,23,42,0.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.18);color:#fff}
@keyframes tt-scroll{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.title{position:absolute;top:16px;left:20px;z-index:5;font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(1.4rem,3vw,2.2rem);background:linear-gradient(135deg,#fbbf24,#f472b6,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;pointer-events:none}
.lil-gui{--background-color:#0d0d1a;--text-color:#e6e2f5;--title-background-color:#141428;--title-text-color:#f4f1ea;--widget-color:#4c1d95;--hover-color:#6d28d9;--focus-color:#7c3aed;--number-color:#ff6ec7;--string-color:#a5f3c8;--font-size:12px;--input-font-size:12px;--padding:5px;--spacing:5px;--widget-height:18px;--slider-knob-width:6px;--widget-border-radius:9px;--name-width:42%}
.lil-gui .lil-slider{height:18px;border-radius:9px;background:var(--widget-color)}
.lil-gui .lil-slider .lil-fill{border-right-width:6px;border-right-color:#ff6ec7}
.lil-gui .lil-slider.lil-active{background:var(--focus-color)}
.lil-gui .title{letter-spacing:.05em}
.lil-gui .folder>.title{background:#191930}
</style>
</head>
<body>
<header><div class="brand"><b>Tilted Tiles Lab</b><span>parameter control</span></div></header>
<main>
  <div id="sidePanel"><div id="panelWrap"></div></div>
  <div id="previews">
    <div class="preview">
      <div class="title rising-title" id="risingTitle">English Speaking Practice</div>
      <div class="tt-wrap" id="wrap">
        <div class="tt-plane" id="plane"></div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
<script>
const imgs = [
 "https://images.pexels.com/photos/7587828/pexels-photo-7587828.jpeg?auto=compress&cs=tinysrgb&w=640",
 "https://images.pexels.com/photos/990432/pexels-photo-990432.jpeg?auto=compress&cs=tinysrgb&w=640",
 "https://images.pexels.com/photos/5710564/pexels-photo-5710564.jpeg?auto=compress&cs=tinysrgb&w=640",
 "https://images.pexels.com/photos/8199602/pexels-photo-8199602.jpeg?auto=compress&cs=tinysrgb&w=640",
 "https://images.pexels.com/photos/34985169/pexels-photo-34985169.jpeg?auto=compress&cs=tinysrgb&w=640",
 "https://images.pexels.com/photos/3912425/pexels-photo-3912425.jpeg?auto=compress&cs=tinysrgb&w=640",
 "https://images.pexels.com/photos/10034809/pexels-photo-10034809.jpeg?auto=compress&cs=tinysrgb&w=640",
 "https://images.pexels.com/photos/4253300/pexels-photo-4253300.jpeg?auto=compress&cs=tinysrgb&w=640",
 "https://images.pexels.com/photos/7149129/pexels-photo-7149129.jpeg?auto=compress&cs=tinysrgb&w=640",
 "https://images.pexels.com/photos/25596879/pexels-photo-25596879.jpeg?auto=compress&cs=tinysrgb&w=640"
];
const names = ["Accommodation","Books","Daily Routine","Education","Environment","Family","Festivals","Food","Friends","Health","Hobbies","Languages","Mobile Phones","Movies","Music","Newspapers","Outdoor","Parties","Pets","Photography"];

const plane=document.getElementById('plane');
const wrap=document.getElementById('wrap');
for(let c=0;c<3;c++){
  const col=document.createElement('div'); col.className='tt-col';
  for(let i=0;i<10;i++){
    const t=document.createElement('div'); t.className='tt-tile';
    const img=document.createElement('img'); img.src=imgs[(c*3+i)%imgs.length]; img.loading='lazy';
    t.appendChild(img);
    const sp=document.createElement('span'); sp.textContent=names[(c*3+i)%names.length]; t.appendChild(sp);
    col.appendChild(t);
  }
  for(let i=0;i<10;i++){
    const t=document.createElement('div'); t.className='tt-tile';
    const img=document.createElement('img'); img.src=imgs[(c*3+i)%imgs.length]; img.loading='lazy';
    t.appendChild(img);
    const sp=document.createElement('span'); sp.textContent=names[(c*3+i)%names.length]; t.appendChild(sp);
    col.appendChild(t);
  }
  plane.appendChild(col);
}
const P={persp:1600,rx:40,ry:16,rz:-20,pw:280,ph:260,tw:880,ta:1,rg:24,cg:24,br:12,dur:25,sat:1,ox:-40,oy:0,oz:0,scale:1};
function apply(){
  wrap.style.perspective=P.persp+'px';
  plane.style.width=P.pw+'%';
  plane.style.height=P.ph+'%';
  plane.style.gap=(P.cg*P.scale)+'px';
  plane.style.transform='rotateX('+P.rx+'deg) rotateY('+P.ry+'deg) rotateZ('+P.rz+'deg) translateX('+P.ox+'px) translateY('+P.oy+'px) translateZ('+P.oz+'px)';
  const dur=P.dur+'s';
  plane.querySelectorAll('.tt-col').forEach(col=>{col.style.gap=(P.rg*P.scale)+'px';col.style.animationDuration=dur;});
  plane.querySelectorAll('.tt-tile').forEach(t=>{
    t.style.width=P.tw+'px'; t.style.aspectRatio=P.ta; t.style.borderRadius=P.br+'px';
    t.style.transform='scale('+P.scale+')';
    const img=t.querySelector('img'); if(img) img.style.filter='saturate('+P.sat+')';
  });
}
const gui=new lil.GUI({container:document.getElementById('panelWrap'),title:'Tilted Tiles'});
const f1=gui.addFolder('Transform');
f1.add(P,'persp',400,4000,10).name('perspective').onChange(apply);
f1.add(P,'rx',-80,80,1).name('rotateX').onChange(apply);
f1.add(P,'ry',-80,80,1).name('rotateY').onChange(apply);
f1.add(P,'rz',-80,80,1).name('rotateZ').onChange(apply);
f1.add(P,'ox',-200,200,1).name('offsetX').onChange(apply);
f1.add(P,'oy',-200,200,1).name('offsetY').onChange(apply);
f1.add(P,'oz',-300,300,1).name('offsetZ').onChange(apply);
const f2=gui.addFolder('Plane');
f2.add(P,'pw',100,500,5).name('planeWidth %').onChange(apply);
f2.add(P,'ph',100,500,5).name('planeHeight %').onChange(apply);
f2.add(P,'cg',0,40,1).name('columnGap').onChange(apply);
f2.add(P,'dur',5,80,1).name('duration s').onChange(apply);
const f3=gui.addFolder('Tiles');
f3.add(P,'tw',80,400,5).name('tileWidth').onChange(apply);
f3.add(P,'ta',0.4,2.5,0.1).name('aspectRatio').onChange(apply);
f3.add(P,'rg',0,40,1).name('rowGap').onChange(apply);
f3.add(P,'br',0,40,1).name('borderRadius').onChange(apply);
f3.add(P,'scale',0.3,3,0.1).name('card scale').onChange(apply);
f3.add(P,'sat',0,3,0.1).name('saturation').onChange(apply);
apply();

const rt=document.getElementById('risingTitle');
const text=rt.textContent;
rt.textContent='';
text.split('').forEach(ch=>{
  const sp=document.createElement('span');
  sp.textContent=ch===' '?'\\u00A0':ch;
  rt.appendChild(sp);
});
document.addEventListener('mousemove', e=>{
  const r=rt.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const dx=(e.clientX-cx)/r.width, dy=(e.clientY-cy)/r.height;
  rt.querySelectorAll('span').forEach((sp,i)=>{
    const off=(i-text.length/2)*2;
    sp.style.transform='translateZ('+( -Math.abs(dx*40+dy*20) + off*0.5 )+'px) translateY('+ (dy*6) +'px)';
  });
});
</script>
</body>
</html>
